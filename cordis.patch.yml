# Hindsight graph viewer: one Host row that also ships the Web-page client half.
# The row accepts an optional connection override (apiUrl, apiToken, serverMode,
# apiPort); without one it reads the same HINDSIGHT_* environment and
# ~/.hindsight/coding-agent.json the hindsight-coding-agents plugin uses.
- insert:
    - id: hindsight-graph
      name: '@local/hindsight-graph'
